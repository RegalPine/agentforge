services:
  agentforge-server:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      AGENTFORGE_SERVER_PORT: "8080"
      AGENTFORGE_DEPLOYMENT_MODE: "production"
      AGENTFORGE_DATABASE_TYPE: "postgresql"
      AGENTFORGE_DATABASE_URL: "jdbc:postgresql://postgres:5432/agentforge"
      AGENTFORGE_DATABASE_USERNAME: agentforge
      AGENTFORGE_DATABASE_PASSWORD: agentforge
      AGENTFORGE_REDIS_URI: "redis://redis:6379"
      AGENTFORGE_SESSION_SIGNING_KEY: "${AGENTFORGE_SESSION_SIGNING_KEY}"
      AGENTFORGE_ADMIN_PASSWORD: "${AGENTFORGE_ADMIN_PASSWORD}"
      JAVA_OPTS: "-XX:+UseG1GC -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    stop_signal: SIGTERM

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentforge
      POSTGRES_USER: agentforge
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-agentforge}"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentforge"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
